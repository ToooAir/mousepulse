# Build Windows binaries on every push/PR; publish a GitHub Release for v* tags.
# Cross-compiles from Linux with mingw-w64, same as the local macOS setup.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  TARGET: x86_64-pc-windows-gnu

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          rustup toolchain install stable --profile minimal -c rustfmt -c clippy
          rustup target add "$TARGET"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gcc-mingw-w64-x86-64

      - run: cargo fmt --check
      - run: cargo test --lib
      - run: cargo clippy --release --target "$TARGET" -- -D warnings
      - run: cargo build --release --target "$TARGET"

      - name: Collect binaries
        run: |
          mkdir dist
          cp target/$TARGET/release/mousepulse.exe target/$TARGET/release/mousepulse-cli.exe dist/
          cd dist && sha256sum *.exe > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: mousepulse-windows-x64
          path: dist/

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag matches Cargo.toml
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          name: mousepulse-windows-x64
          path: dist

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "MousePulse $GITHUB_REF_NAME" --generate-notes
